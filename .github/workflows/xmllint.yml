name: Validate Xml
on: push

jobs:
  validate:
    strategy:
      fail-fast: true

    runs-on: ubuntu-latest

    steps:
    - name: Install xmllint
      run: |
        sudo apt-get update
        sudo apt-get install -y make libxml2-utils

    - name: Checkout
      uses: actions/checkout@v2

    - name: Validate
      run: make gpxlint
